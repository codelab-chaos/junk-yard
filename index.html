<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- First paint matches --bg, and the body stays hidden until base.css (unlayered, so it wins) shows it. -->
    <style>html{background:#f6f5f2}@media (prefers-color-scheme:dark){html{background:#15171c}}@layer gate{body{visibility:hidden}}</style>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/junkyard.svg" />
    <title>Junk Yard</title>
    <meta name="description" content="A catalog of one-off web apps, tools and research pages." />
  </head>
  <body>
    <button id="chute" class="chute" type="button" aria-pressed="false" aria-label="Tinker with the junk chute" title="Tinker with the junk chute">
      <svg viewBox="0 0 96 84" width="84" height="74" aria-hidden="true">
        <polygon class="body" points="6,10 90,10 62,46 34,46" />
        <polygon class="shade" points="60,10 90,10 62,46 52,46" />
        <rect class="body" x="36" y="46" width="24" height="34" />
        <rect class="shade" x="52" y="46" width="8" height="34" />
        <rect class="rim" x="0" y="0" width="96" height="10" rx="1" />
        <rect class="shade" x="33" y="76" width="30" height="5" rx="1" />
        <circle class="rivet" cx="16" cy="16" r="1.6" />
        <circle class="rivet" cx="80" cy="16" r="1.6" />
        <circle class="rivet" cx="42" cy="52" r="1.4" />
        <circle class="rivet" cx="54" cy="52" r="1.4" />
      </svg>
      <span class="chute-tag">Tinker</span>
    </button>
    <header class="site-header">
      <h1>Junk Yard</h1>
      <p>One-off apps, tools and research. Search everything.</p>
      <input id="search" type="search" placeholder="Search apps, tags, contents..." autocomplete="off" />
      <div id="tags" class="tag-row"></div>
    </header>
    <main>
      <p id="count" class="count"></p>
      <ul id="apps" class="app-grid"></ul>
    </main>
    <script type="module" src="/src/catalog/main.ts"></script>
  </body>
</html>
